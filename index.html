<!DOCTYPE html>
<html>
<head>
    <title>Factory Locations & Updates Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- PapaParse for converting Google Sheet CSV to Web Data -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: Arial, sans-serif; background-color: #1e293b; color: white; }
        #sidebar { width: 35%; overflow-y: auto; background-color: #0f172a; padding: 20px; box-sizing: border-box; }
        #map { width: 65%; height: 100%; }
        h1 { font-size: 1.2rem; margin-top: 0; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        /* Sidebar Card Styles */
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: border-color 0.2s; }
        .card:hover { border-color: #38bdf8; }
        .card h2 { font-size: 1.1rem; margin: 0 0 10px 0; color: #38bdf8; }
        .details { font-size: 0.9rem; line-height: 1.4; color: #94a3b8; }
        .date { font-size: 0.8rem; color: #64748b; margin-top: 10px; font-style: italic; }
        
        /* Status Tags */
        .tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; }
        .tag.Operating { background: #166534; color: #86efac; }
        .tag.Awarded { background: #854d0e; color: #fef08a; }
        .tag.Under-Construction { background: #b91c1c; color: #fca5a5; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Management Review Dashboard</h1>
        <div id="card-container">Loading approved updates...</div>
    </div>
    
    <div id="map"></div>

    <script>
        // 1. Initialize Map centered on Indonesia
        const map = L.map('map').setView([-2.5, 118.0], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 2. Correctly assigned Google Sheet published CSV link
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS8CWPQ4VAx1R47aR4IBqHpIbrJVraBd2eajHr0ZZCY3SsGOu2NuB13E7NEnVaIha-i9FCEhI2D7Vq7/pub?gid=594499741&single=true&output=csv';

        // 3. Fetch Data and build Dashboard
        Papa.parse(csvUrl + '&cachebuster=' + Math.random(), {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                const container = document.getElementById('card-container');
                container.innerHTML = ''; 

                data.forEach((row) => {
                    // Only show rows approved by you
                    if (row.Approved_For_Publish !== 'TRUE') return;

                    const lat = parseFloat(row.Latitude);
                    const lng = parseFloat(row.Longitude);
                    if (isNaN(lat) || isNaN(lng)) return; 

                    // Plot marker
                    const marker = L.marker([lat, lng]).addTo(map);
                    marker.bindPopup(`<b>${row.Factory_Name}</b><br>${row.Status}`);

                    // Create sidebar card
                    const card = document.createElement('div');
                    card.className = 'card';
                    const statusClass = (row.Status || '').replace(/\s+/g, '-');

                    card.innerHTML = `
                        <h2>${row.Factory_Name}</h2>
                        <span class="tag ${statusClass}">${row.Status}</span>
                        <div class="details">
                            <strong>Category:</strong> ${row.Category}<br>
                            <strong>Metrics:</strong> ${row.Key_Metrics}<br><br>
                            <strong>Latest Update:</strong><br>${row.Latest_Update}
                        </div>
                        <div class="date">Last Updated: ${row.Last_Updated_Date}</div>
                    `;

                    // Zoom to marker on card click
                    card.addEventListener('click', () => {
                        map.flyTo([lat, lng], 13);
                        marker.openPopup();
                    });

                    // Highlight card on marker click
                    marker.on('click', () => {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        card.style.borderColor = '#38bdf8';
                        setTimeout(() => { card.style.borderColor = '#334155'; }, 2000);
                    });

                    container.appendChild(card);
                });

                if (container.innerHTML === '') {
                    container.innerHTML = '<p>No approved updates available at the moment.</p>';
                }
            },
            error: function(err) {
                document.getElementById('card-container').innerHTML = '<p style="color: #ef4444;">Failed to load data from Google Sheet. Please verify link permissions.</p>';
            }
        });
    </script>
</body>
</html>
