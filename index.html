<!DOCTYPE html>
<html>
<head>
    <title>Factory Locations & Updates Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- PapaParse for Google Sheet CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e293b; 
            color: white; 
        }
        
        /* Collapsible Sidebar */
        #sidebar { 
            width: 380px; 
            min-width: 340px;
            max-width: 420px;
            height: 100%;
            background-color: #0f172a; 
            display: flex;
            flex-direction: column;
            box-sizing: border-box; 
            z-index: 1000; 
            box-shadow: 2px 0 12px rgba(0,0,0,0.6); 
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sidebar.collapsed { 
            margin-left: -380px; 
        }

        /* Sidebar Header & Filters */
        .sidebar-header {
            padding: 20px 20px 12px 20px;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }

        h1 { 
            font-size: 1.25rem; 
            margin: 0 0 12px 0; 
            color: #f8fafc; 
            letter-spacing: 0.5px;
        }

        /* Filter Buttons Bar */
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .filter-btn {
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .filter-btn:hover {
            border-color: #94a3b8;
            color: white;
        }

        .filter-btn.active {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        /* Color dots inside buttons */
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-green { background: #16a34a; }
        .dot-blue { background: #2563eb; }
        .dot-red { background: #dc2626; }
        .dot-yellow { background: #eab308; }
        .dot-grey { background: #64748b; }

        /* Card Scroll Area */
        #card-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        /* Sidebar Cards */
        .card { 
            background-color: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            padding: 16px; 
            margin-bottom: 14px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .card:hover { 
            border-color: #38bdf8; 
            transform: translateY(-2px); 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); 
        }
        .card h2 { font-size: 1.1rem; margin: 0 0 10px 0; color: #38bdf8; }
        .details { font-size: 0.88rem; line-height: 1.45; color: #cbd5e1; }
        .date { font-size: 0.75rem; color: #64748b; margin-top: 10px; font-style: italic; }
        
        /* Status Badges */
        .tag { 
            display: inline-block; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 0.72rem; 
            font-weight: bold; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .tag-green { background: #166534; color: #86efac; }
        .tag-blue { background: #1e40af; color: #93c5fd; }
        .tag-red { background: #991b1b; color: #fca5a5; }
        .tag-yellow { background: #854d0e; color: #fef08a; }
        .tag-grey { background: #334155; color: #cbd5e1; }

        /* Map Container */
        #map-wrapper {
            flex: 1;
            height: 100%;
            position: relative;
        }
        #map { width: 100%; height: 100%; }

        /* Floating Panel Toggle Button */
        #toggle-sidebar-btn {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 999;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 13px;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
        }
        #toggle-sidebar-btn:hover {
            background: #1e293b;
            color: white;
            border-color: #38bdf8;
        }

        /* Floating Legend */
        .info.legend { 
            background: white; 
            padding: 12px 14px; 
            border-radius: 8px; 
            box-shadow: 0 1px 5px rgba(0,0,0,0.4); 
            color: #334155; 
            font-size: 12px; 
            line-height: 19px; 
            max-width: 230px;
        }
        .info.legend h4 { margin: 0 0 6px; font-size: 13px; color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px;}
        .info.legend i { width: 13px; height: 13px; float: left; margin-right: 7px; opacity: 0.9; border-radius: 50%; margin-top: 3px;}
        
        /* Map Popup */
        .leaflet-popup-content-wrapper { background: #1e293b; color: white; border-radius: 8px; border: 1px solid #334155; }
        .leaflet-popup-tip { background: #1e293b; }
        .leaflet-popup-content b { color: #38bdf8; font-size: 1.05em;}
    </style>
</head>
<body>

    <!-- Sidebar Panel -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>Review Dashboard</h1>
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="completed"><span class="dot dot-green"></span> In Operation / Completed</button>
                <button class="filter-btn" data-filter="construction"><span class="dot dot-blue"></span> Under Construction</button>
                <button class="filter-btn" data-filter="awarded"><span class="dot dot-red"></span> Awarded</button>
                <button class="filter-btn" data-filter="bidding"><span class="dot dot-yellow"></span> In Bidding / Tender</button>
                <button class="filter-btn" data-filter="planning"><span class="dot dot-grey"></span> Planning</button>
            </div>
        </div>
        <div id="card-container">Loading approved updates...</div>
    </div>
    
    <!-- Map Area -->
    <div id="map-wrapper">
        <button id="toggle-sidebar-btn">◀ Hide Dashboard</button>
        <div id="map"></div>
    </div>

    <script>
        // 1. Base Map Layers
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });

        const standardLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });

        // 2. Initialize Leaflet Map
        const map = L.map('map', {
            center: [2.5, 112.0],
            zoom: 6,
            layers: [satelliteLayer]
        });

        // 3. Basemap Selector (Top Right)
        const baseMaps = {
            "Satellite": satelliteLayer,
            "Standard": standardLayer
        };
        L.control.layers(baseMaps, null, {position: 'topright', collapsed: false}).addTo(map);

        // 4. Floating Legend (Bottom Right)
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = `
                <h4>Legend · Status</h4>
                <i style="background: #16a34a"></i> In Operation / Completed<br>
                <i style="background: #2563eb"></i> Under construction<br>
                <i style="background: #dc2626"></i> Awarded<br>
                <i style="background: #eab308"></i> In bidding / tender<br>
                <i style="background: #64748b"></i> Planning<br>
                <br>
                <h4>Sector</h4>
                <b>♻️</b> Waste-to-Energy<br>
            `;
            return div;
        };
        legend.addTo(map);

        // 5. Global State & Marker Group
        let allApprovedData = [];
        let activeFilter = 'all';
        const markersLayerGroup = L.layerGroup().addTo(map);

        // Helper: Categorize status strings
        function getCategoryKey(status) {
            const s = (status || '').toLowerCase();
            if (s.includes('operation') || s.includes('completed')) return 'completed';
            if (s.includes('construction')) return 'construction';
            if (s.includes('awarded')) return 'awarded';
            if (s.includes('bidding') || s.includes('tender')) return 'bidding';
            if (s.includes('planning')) return 'planning';
            return 'planning';
        }

        // Helper: Get Color & Badge Class
        function getStatusStyling(statusKey) {
            switch (statusKey) {
                case 'completed': return { color: '#16a34a', tagClass: 'tag-green' };
                case 'construction': return { color: '#2563eb', tagClass: 'tag-blue' };
                case 'awarded': return { color: '#dc2626', tagClass: 'tag-red' };
                case 'bidding': return { color: '#eab308', tagClass: 'tag-yellow' };
                case 'planning': return { color: '#64748b', tagClass: 'tag-grey' };
                default: return { color: '#64748b', tagClass: 'tag-grey' };
            }
        }

        // 6. Render Cards and Map Pins Based on Filter
        function renderDashboard() {
            const container = document.getElementById('card-container');
            container.innerHTML = '';
            markersLayerGroup.clearLayers();

            const visibleCoords = [];

            // Filter data
            const filteredData = allApprovedData.filter(row => {
                if (activeFilter === 'all') return true;
                return getCategoryKey(row.Status) === activeFilter;
            });

            filteredData.forEach(row => {
                const lat = parseFloat(row.Latitude);
                const lng = parseFloat(row.Longitude);
                if (isNaN(lat) || isNaN(lng)) return;

                const statusKey = getCategoryKey(row.Status);
                const styling = getStatusStyling(statusKey);

                // Add Circle Marker to Layer Group
                const marker = L.circleMarker([lat, lng], {
                    radius: 8,
                    fillColor: styling.color,
                    color: "#ffffff",
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.95
                }).addTo(markersLayerGroup);

                marker.bindPopup(`<b>${row.Factory_Name}</b><br>${row.Status}<br><i>${row.Category}</i>`);
                visibleCoords.push([lat, lng]);

                // Create Sidebar Card
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h2>♻️ ${row.Factory_Name}</h2>
                    <span class="tag ${styling.tagClass}">${row.Status}</span>
                    <div class="details">
                        <strong>Category:</strong> ${row.Category}<br>
                        <strong>Metrics:</strong> ${row.Key_Metrics || 'N/A'}<br><br>
                        <strong>Latest Update:</strong><br>${row.Latest_Update || 'No updates available.'}
                    </div>
                    <div class="date">Last Updated: ${row.Last_Updated_Date || 'Unknown'}</div>
                `;

                // Interactivity
                card.addEventListener('click', () => {
                    map.flyTo([lat, lng], 13, { duration: 1.2 });
                    marker.openPopup();
                });

                marker.on('click', () => {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    card.style.borderColor = '#38bdf8';
                    card.style.backgroundColor = '#0f172a';
                    setTimeout(() => { 
                        card.style.borderColor = '#334155'; 
                        card.style.backgroundColor = '#1e293b'; 
                    }, 2200);
                });

                container.appendChild(card);
            });

            // Adjust map view bounds to remaining pins
            if (visibleCoords.length > 0) {
                map.fitBounds(visibleCoords, { padding: [60, 60], maxZoom: 12 });
            }

            if (filteredData.length === 0) {
                container.innerHTML = `<p style="color: #94a3b8; font-size: 0.9rem; text-align: center; margin-top: 30px;">No projects found under this status.</p>`;
            }
        }

        // 7. Filter Button Click Handlers
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.getAttribute('data-filter');
                renderDashboard();
            });
        });

        // 8. Collapsible Sidebar Toggle
        const toggleBtn = document.getElementById('toggle-sidebar-btn');
        const sidebar = document.getElementById('sidebar');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            const isCollapsed = sidebar.classList.contains('collapsed');
            toggleBtn.innerHTML = isCollapsed ? '☰ Show Dashboard' : '◀ Hide Dashboard';
            
            // Allow CSS animation to finish, then recalculate map dimensions
            setTimeout(() => {
                map.invalidateSize();
            }, 320);
        });

        // 9. Fetch Data from Google Sheet
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS8CWPQ4VAx1R47aR4IBqHpIbrJVraBd2eajHr0ZZCY3SsGOu2NuB13E7NEnVaIha-i9FCEhI2D7Vq7/pub?gid=594499741&single=true&output=csv';

        Papa.parse(csvUrl + '&cachebuster=' + new Date().getTime(), {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                // Filter only Approved rows
                allApprovedData = results.data.filter(row => row.Approved_For_Publish === 'TRUE');
                renderDashboard();
            },
            error: function(err) {
                document.getElementById('card-container').innerHTML = '<p style="color: #ef4444;">Failed to load data. Please check permissions.</p>';
                console.error("CSV Fetch Error: ", err);
            }
        });
    </script>
</body>
</html>
