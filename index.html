<!DOCTYPE html>
<html>
<head>
    <title>Review Dashboard & Factory Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Cloudflare CDN for Reliable Global & China Access -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e293b; color: white; }
        
        #sidebar { width: 380px; min-width: 340px; max-width: 420px; height: 100%; background-color: #0f172a; display: flex; flex-direction: column; box-sizing: border-box; z-index: 1000; box-shadow: 2px 0 12px rgba(0,0,0,0.6); transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #sidebar.collapsed { margin-left: -380px; }
        .sidebar-header { padding: 20px 20px 12px 20px; border-bottom: 1px solid #334155; flex-shrink: 0; }
        h1 { font-size: 1.25rem; margin: 0 0 12px 0; color: #f8fafc; letter-spacing: 0.5px; }

        .filter-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .filter-btn { background-color: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 5px 9px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 5px; }
        .filter-btn:hover { border-color: #94a3b8; color: white; }
        .filter-btn.active { background-color: #38bdf8; color: #0f172a; border-color: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }

        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-wte { background: #10b981; } 
        .dot-assembly { background: #3b82f6; } 
        .dot-municipal { background: #8b5cf6; } 
        .dot-manufacturing { background: #f59e0b; } 
        .dot-others { background: #6b7280; } 

        #card-container { flex: 1; overflow-y: auto; padding: 16px 20px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 14px; cursor: pointer; transition: all 0.2s ease; }
        .card:hover { border-color: #38bdf8; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
        .card h2 { font-size: 1.1rem; margin: 0 0 10px 0; color: #38bdf8; }
        .details { font-size: 0.88rem; line-height: 1.45; color: #cbd5e1; }
        .date { font-size: 0.75rem; color: #64748b; margin-top: 10px; font-style: italic; }
        
        .tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .tag-green { background: #166534; color: #86efac; }
        .tag-blue { background: #1e40af; color: #93c5fd; }
        .tag-red { background: #991b1b; color: #fca5a5; }
        .tag-yellow { background: #854d0e; color: #fef08a; }
        .tag-grey { background: #334155; color: #cbd5e1; }

        #map-wrapper { flex: 1; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; }

        #toggle-sidebar-btn { position: absolute; top: 14px; left: 14px; z-index: 999; background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 6px; padding: 8px 13px; font-size: 0.82rem; font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4); transition: all 0.2s ease; }
        #toggle-sidebar-btn:hover { background: #1e293b; color: white; border-color: #38bdf8; }

        .info.legend { background: white; padding: 12px 14px; border-radius: 8px; box-shadow: 0 1px 5px rgba(0,0,0,0.4); color: #334155; font-size: 12px; line-height: 19px; max-width: 250px; }
        .info.legend h4 { margin: 0 0 6px; font-size: 13px; color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px;}
        .info.legend i { width: 13px; height: 13px; float: left; margin-right: 7px; opacity: 0.9; border-radius: 50%; margin-top: 3px;}
        .legend-item { cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: background-color 0.2s; }
        .legend-item:hover { background-color: #f1f5f9; }
        .legend-item.active { background-color: #e2e8f0; font-weight: bold; }
        
        .leaflet-popup-content-wrapper { background: #1e293b; color: white; border-radius: 8px; border: 1px solid #334155; }
        .leaflet-popup-tip { background: #1e293b; }
        .leaflet-popup-content b { color: #38bdf8; font-size: 1.05em;}
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1>Review Dashboard</h1>
            <div class="filter-container">
                <button class="filter-btn active" data-filter-type="industry" data-filter="all">All</button>
                <button class="filter-btn" data-filter-type="industry" data-filter="waste-to-energy"><span class="dot dot-wte"></span> Waste-to-Energy</button>
                <button class="filter-btn" data-filter-type="industry" data-filter="assembly"><span class="dot dot-assembly"></span> Assembly</button>
                <button class="filter-btn" data-filter-type="industry" data-filter="municipal"><span class="dot dot-municipal"></span> Municipal WTE</button>
                <button class="filter-btn" data-filter-type="industry" data-filter="manufacturing"><span class="dot dot-manufacturing"></span> Manufacturing</button>
                <button class="filter-btn" data-filter-type="industry" data-filter="others"><span class="dot dot-others"></span> Others</button>
            </div>
        </div>
        <div id="card-container">Loading approved updates...</div>
    </div>
    
    <div id="map-wrapper">
        <button id="toggle-sidebar-btn">◀ Hide Dashboard</button>
        <div id="map"></div>
    </div>

    <script>
        // Global Error Catcher
        window.addEventListener('error', function(e) {
            document.getElementById('card-container').innerHTML = `<p style="color: #ef4444; padding: 20px;">System Error: Map library blocked or failed to load. Please disable adblockers or try another network.</p>`;
        });

        // Initialize Map with China-Accessible Tile Servers (Works in China & Malaysia without VPN)
        const satelliteLayer = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
            subdomains: ['1', '2', '3', '4'],
            attribution: 'Tiles &copy; AutoNavi'
        });
        const standardLayer = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            subdomains: ['1', '2', '3', '4'],
            attribution: 'Tiles &copy; AutoNavi'
        });

        const map = L.map('map', { center: [2.5, 112.0], zoom: 6, layers: [satelliteLayer] });
        L.control.layers({ "Satellite": satelliteLayer, "Standard": standardLayer }, null, {position: 'topright'}).addTo(map);

        // Legend
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = `
                <h4>Legend · Status</h4>
                <div class="legend-item" data-filter-type="status" data-filter="operating"><i style="background: #16a34a"></i> Operating</div>
                <div class="legend-item" data-filter-type="status" data-filter="under construction"><i style="background: #2563eb"></i> Under Construction</div>
                <div class="legend-item" data-filter-type="status" data-filter="awarded"><i style="background: #dc2626"></i> Awarded</div>
                <div class="legend-item" data-filter-type="status" data-filter="tender"><i style="background: #eab308"></i> Tender</div>
                <div class="legend-item" data-filter-type="status" data-filter="planning"><i style="background: #64748b"></i> Planning / Potential</div>
            `;
            return div;
        };
        legend.addTo(map);

        let allApprovedData = [];
        let activeFilterType = 'industry'; 
        let activeFilterValue = 'all';
        const markersLayerGroup = L.layerGroup().addTo(map);

        // "Fuzzy Match" helper to find columns even if headers have hidden spaces
        function getVal(row, possibleKeys) {
            const actualKey = Object.keys(row).find(k => possibleKeys.some(pk => k.toLowerCase().includes(pk.toLowerCase())));
            return actualKey ? row[actualKey] : '';
        }

        function getStatusStyling(status) {
            const s = String(status).toLowerCase().trim();
            if (s.includes('operat') || s.includes('complet')) return { color: '#16a34a', tagClass: 'tag-green' };
            if (s.includes('construction')) return { color: '#2563eb', tagClass: 'tag-blue' };
            if (s.includes('award')) return { color: '#dc2626', tagClass: 'tag-red' };
            if (s.includes('tender') || s.includes('bid')) return { color: '#eab308', tagClass: 'tag-yellow' };
            return { color: '#64748b', tagClass: 'tag-grey' };
        }

        function matchIndustry(industry, filterValue) {
           const i = String(industry).toLowerCase().trim();
           if (filterValue === 'waste-to-energy' && i === 'waste-to-energy') return true;
           if (filterValue === 'assembly' && i === 'assembly') return true;
           if (filterValue === 'municipal' && i.includes('municipal')) return true;
           if (filterValue === 'manufacturing' && i === 'manufacturing') return true;
           
           // If "Others" is selected, match anything that is NOT one of the primary 4
           if (filterValue === 'others') {
               if (i === 'waste-to-energy' || i === 'assembly' || i.includes('municipal') || i === 'manufacturing') return false;
               return true;
           }
           return false;
        }

        function renderDashboard() {
            const container = document.getElementById('card-container');
            container.innerHTML = '';
            markersLayerGroup.clearLayers();
            const visibleCoords = [];

            const filteredData = allApprovedData.filter(row => {
                if (activeFilterValue === 'all') return true;
                
                const rowInd = getVal(row, ['industr']);
                const rowStatus = getVal(row, ['status']);
                
                if (activeFilterType === 'industry') {
                     return matchIndustry(rowInd, activeFilterValue);
                } else if (activeFilterType === 'status') {
                     const s = String(rowStatus).toLowerCase().trim();
                     let mappedStatus = 'unknown';
                     if (s.includes('operat') || s.includes('complet')) mappedStatus = 'operating';
                     else if (s.includes('construction')) mappedStatus = 'under construction';
                     else if (s.includes('award')) mappedStatus = 'awarded';
                     else if (s.includes('tender') || s.includes('bid')) mappedStatus = 'tender';
                     else if (s.includes('plan') || s.includes('potential')) mappedStatus = 'planning';
                     
                     return mappedStatus === activeFilterValue;
                }
                return true;
            });

            filteredData.forEach(row => {
                const lat = parseFloat(getVal(row, ['lat']));
                const lng = parseFloat(getVal(row, ['lon', 'lng']));
                if (isNaN(lat) || isNaN(lng)) return;

                const status = getVal(row, ['status']) || 'Unknown';
                const industry = getVal(row, ['industr']) || 'Others';
                const fName = getVal(row, ['factory', 'name']) || 'Unnamed';
                
                const styling = getStatusStyling(status);

                const marker = L.circleMarker([lat, lng], { radius: 8, fillColor: styling.color, color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.95 }).addTo(markersLayerGroup);
                marker.bindPopup(`<b>${fName}</b><br>${status}<br><i>${industry}</i>`);
                visibleCoords.push([lat, lng]);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h2>♻️ ${fName}</h2>
                    <span class="tag ${styling.tagClass}">${status}</span>
                    <div class="details">
                        <strong>Industry:</strong> ${industry}<br>
                        <strong>Metrics:</strong> ${getVal(row, ['metric']) || 'N/A'}<br><br>
                        <strong>Latest Update:</strong><br>${getVal(row, ['latest', 'update']) || 'No updates.'}
                    </div>
                    <div class="date">Last Updated: ${getVal(row, ['date', 'time', 'last']) || 'Unknown'}</div>
                `;

                card.addEventListener('click', () => { map.flyTo([lat, lng], 13, { duration: 1.2 }); marker.openPopup(); });
                marker.on('click', () => {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    card.style.borderColor = '#38bdf8'; card.style.backgroundColor = '#0f172a';
                    setTimeout(() => { card.style.borderColor = '#334155'; card.style.backgroundColor = '#1e293b'; }, 2200);
                });
                container.appendChild(card);
            });

            if (visibleCoords.length > 0) map.fitBounds(visibleCoords, { padding: [60, 60], maxZoom: 12 });
            if (filteredData.length === 0) container.innerHTML = `<p style="color: #94a3b8; font-size: 0.9rem; text-align: center; margin-top: 30px;">No projects found under this selection.</p>`;
        }

        function updateActiveFilters() {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('active');
                if (activeFilterType === 'industry' && b.getAttribute('data-filter') === activeFilterValue) b.classList.add('active');
                else if (activeFilterType === 'status' && activeFilterValue === 'all' && b.getAttribute('data-filter') === 'all') b.classList.add('active');
            });
            document.querySelectorAll('.legend-item').forEach(l => {
                l.classList.remove('active');
                if (activeFilterType === 'status' && l.getAttribute('data-filter') === activeFilterValue) l.classList.add('active');
            });
            renderDashboard();
        }

        setTimeout(() => {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => { activeFilterType = btn.getAttribute('data-filter-type'); activeFilterValue = btn.getAttribute('data-filter'); updateActiveFilters(); });
            });
            document.querySelectorAll('.legend-item').forEach(item => {
                item.addEventListener('click', () => {
                    if (activeFilterType === 'status' && activeFilterValue === item.getAttribute('data-filter')) {
                        activeFilterType = 'industry'; activeFilterValue = 'all';
                    } else {
                        activeFilterType = item.getAttribute('data-filter-type'); activeFilterValue = item.getAttribute('data-filter');
                    }
                    updateActiveFilters();
                });
            });
        }, 500);

        const toggleBtn = document.getElementById('toggle-sidebar-btn');
        const sidebar = document.getElementById('sidebar');
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            toggleBtn.innerHTML = sidebar.classList.contains('collapsed') ? '☰ Show Dashboard' : '◀ Hide Dashboard';
            setTimeout(() => { map.invalidateSize(); }, 320);
        });

        // Load CSV directly from GitHub repository (supports both data.csv.csv and data.csv)
        function loadCsvData(primaryFile, fallbackFile) {
            Papa.parse(primaryFile + '?cachebuster=' + new Date().getTime(), {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const hasValidColumns = results.data && results.data.some(row => getVal(row, ['factory', 'name', 'status']));
                    if (hasValidColumns) {
                        allApprovedData = results.data.filter(row => {
                            const approved = getVal(row, ['approved', 'publish']);
                            return String(approved).toUpperCase().trim() === 'TRUE';
                        });
                        renderDashboard();
                    } else if (fallbackFile) {
                        loadCsvData(fallbackFile, null);
                    } else {
                        document.getElementById('card-container').innerHTML = '<p style="color: #ef4444; padding: 20px;">Failed to load data. Please verify that data.csv.csv (or data.csv) is uploaded in your GitHub repository.</p>';
                    }
                },
                error: function(err) {
                    if (fallbackFile) {
                        loadCsvData(fallbackFile, null);
                    } else {
                        document.getElementById('card-container').innerHTML = '<p style="color: #ef4444; padding: 20px;">Failed to load data. Please verify that data.csv.csv (or data.csv) is uploaded in your GitHub repository.</p>';
                    }
                }
            });
        }

        loadCsvData('data.csv.csv', 'data.csv');
    </script>
</body>
</html>
