<!DOCTYPE html>
<html>
<head>
    <title>Factory Locations & Updates Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- PapaParse for Google Sheet CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e293b; 
            color: white; 
        }
        
        /* Collapsible Sidebar */
        #sidebar { 
            width: 380px; 
            min-width: 340px;
            max-width: 420px;
            height: 100%;
            background-color: #0f172a; 
            display: flex;
            flex-direction: column;
            box-sizing: border-box; 
            z-index: 1000; 
            box-shadow: 2px 0 12px rgba(0,0,0,0.6); 
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sidebar.collapsed { 
            margin-left: -380px; 
        }

        /* Sidebar Header & Filters */
        .sidebar-header {
            padding: 20px 20px 12px 20px;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }

        h1 { 
            font-size: 1.25rem; 
            margin: 0 0 12px 0; 
            color: #f8fafc; 
            letter-spacing: 0.5px;
        }

        /* Filter Buttons Bar (Industry) */
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .filter-btn {
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .filter-btn:hover {
            border-color: #94a3b8;
            color: white;
        }

        .filter-btn.active {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        /* Color dots inside buttons (Industry Colors) */
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-wte { background: #10b981; } /* Emerald */
        .dot-assembly { background: #3b82f6; } /* Blue */
        .dot-municipal { background: #8b5cf6; } /* Purple */
        .dot-manufacturing { background: #f59e0b; } /* Amber */
        .dot-others { background: #6b7280; } /* Gray */

        /* Card Scroll Area */
        #card-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        /* Sidebar Cards */
        .card { 
            background-color: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            padding: 16px; 
            margin-bottom: 14px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .card:hover { 
            border-color: #38bdf8; 
            transform: translateY(-2px); 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); 
        }
        .card h2 { font-size: 1.1rem; margin: 0 0 10px 0; color: #38bdf8; }
        .details { font-size: 0.88rem; line-height: 1.45; color: #cbd5e1; }
        .date { font-size: 0.75rem; color: #64748b; margin-top: 10px; font-style: italic; }
        
        /* Status Badges */
        .tag { 
            display: inline-block; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 0.72rem; 
            font-weight: bold; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .tag-green { background: #166534; color: #86efac; }
        .tag-blue { background: #1e40af; color: #93c5fd; }
        .tag-red { background: #991b1b; color: #fca5a5; }
        .tag-yellow { background: #854d0e; color: #fef08a; }
        .tag-grey { background: #334155; color: #cbd5e1; }

        /* Map Container */
        #map-wrapper {
            flex: 1;
            height: 100%;
            position: relative;
        }
        #map { width: 100%; height: 100%; }

        /* Floating Panel Toggle Button */
        #toggle-sidebar-btn {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 999;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 13px;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
        }
        #toggle-sidebar-btn:hover {
            background: #1e293b;
            color: white;
            border-color: #38bdf8;
        }

        /* Floating Legend */
        .info.legend { 
            background: white; 
            padding: 12px 14px; 
            border-radius: 8px; 
            box-shadow: 0 1px 5px rgba(0,0,0,0.4); 
            color: #334155; 
            font-size: 12px; 
            line-height: 19px; 
            max-width: 250px;
        }
        .info.legend h4 { margin: 0 0 6px; font-size: 13px; color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px;}
        .info.legend i { width: 13px; height: 13px; float: left; margin-right: 7px; opacity: 0.9; border-radius: 50%; margin-top: 3px;}
        
        /* Clickable Legend Items */
        .legend-item {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .legend-item:hover {
            background-color: #f1f5f9;
        }
        .legend-item.active {
            background-color: #e2e8f0;
            font-weight: bold;
        }
        
        /* Map Popup */
        .leaflet-popup-content-wrapper { background: #1e293b; color: white; border-radius: 8px; border: 1px solid #334155; }
        .leaflet-popup-tip { background: #1e293b; }
        .leaflet-popup-content b { color: #38bdf8; font-size: 1.05em;}
    </style>
</head>
<body>

    <!-- Sidebar Panel -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>Review Dashboard</h1>
            <div class="filter-container">
                <button class="filter-btn active" data-filter-type="industry" data-filter="all">All</button>
                <button class="filter-btn" data-filter-type="industry" data-filter="waste-to-energy"><span class="dot dot-wte"></span> Waste-to-Energy</button>
                <button class="filter-btn" data-filter-type="industry" data-filter="assembly"><span class="dot dot-assembly"></span> Assembly</button>
                <button class="filter-btn" data-filter-type="industry" data-filter="municipal-waste-to-energy"><span class="dot dot-municipal"></span> Municipal WTE</button>
                <button class="filter-btn" data-filter-type="industry" data-filter="manufacturing"><span class="dot dot-manufacturing"></span> Manufacturing</button>
                <button class="filter-btn" data-filter-type="industry" data-filter="others"><span class="dot dot-others"></span> Others</button>
            </div>
        </div>
        <div id="card-container">Loading approved updates...</div>
    </div>
    
    <!-- Map Area -->
    <div id="map-wrapper">
        <button id="toggle-sidebar-btn">◀ Hide Dashboard</button>
        <div id="map"></div>
    </div>

    <script>
        // 1. Base Map Layers
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });

        const standardLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });

        // 2. Initialize Leaflet Map
        const map = L.map('map', {
            center: [2.5, 112.0],
            zoom: 6,
            layers: [satelliteLayer]
        });

        // 3. Basemap Selector (Top Right)
        const baseMaps = {
            "Satellite": satelliteLayer,
            "Standard": standardLayer
        };
        L.control.layers(baseMaps, null, {position: 'topright', collapsed: false}).addTo(map);

        // 4. Floating Legend (Bottom Right)
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = `
                <h4>Legend · Status</h4>
                <div class="legend-item" data-filter-type="status" data-filter="operating"><i style="background: #16a34a"></i> Operating</div>
                <div class="legend-item" data-filter-type="status" data-filter="under construction"><i style="background: #2563eb"></i> Under Construction</div>
                <div class="legend-item" data-filter-type="status" data-filter="awarded"><i style="background: #dc2626"></i> Awarded</div>
                <div class="legend-item" data-filter-type="status" data-filter="tender"><i style="background: #eab308"></i> Tender</div>
                <div class="legend-item" data-filter-type="status" data-filter="planning / potential"><i style="background: #64748b"></i> Planning / Potential</div>
            `;
            return div;
        };
        legend.addTo(map);

        // 5. Global State & Marker Group
        let allApprovedData = [];
        let active
